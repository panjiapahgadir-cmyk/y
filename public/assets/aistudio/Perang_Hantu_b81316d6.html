<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perang Hantu</title>
<style>
:root{--bg:#0b0a1a;--panel:#1b1640;--ink:#f1ecff;--mut:#9a92c9;--acc:#a78bfa;--gold:#fbbf24;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;background:radial-gradient(120% 80% at 50% 0,#241049 0,var(--bg) 60%);color:var(--ink);font-family:"Trebuchet MS",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;min-height:100vh}
#app{width:100%;max-width:720px;padding:10px;display:flex;flex-direction:column;gap:10px}
#sbar{position:relative;height:30px;border-radius:15px;background:var(--panel);border:1px solid rgba(255,255,255,.14);overflow:hidden}
#sfill{height:100%;width:0;background:linear-gradient(90deg,#f59e0b,#fde047)}
#stxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}
#stage{position:relative;border-radius:18px;overflow:hidden;border:1px solid rgba(167,139,250,.4);box-shadow:0 0 28px rgba(139,92,246,.35)}
canvas#c{display:block;width:100%;height:auto}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:12px;background:rgba(8,6,24,.84)}
#ov h1{margin:0;font-size:clamp(22px,7vw,44px);font-weight:900;letter-spacing:.04em;background:linear-gradient(180deg,#fff,#c4b5fd 60%,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px rgba(167,139,250,.7))}
#ov p{margin:0;max-width:30ch;font-size:clamp(11px,3vw,15px);color:var(--mut);line-height:1.4}
#ov div{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{border:0;border-radius:14px;padding:10px 20px;font:800 clamp(13px,3.6vw,17px) inherit;font-family:inherit;color:#fff;background:linear-gradient(180deg,#8b5cf6,#5b34c8);box-shadow:0 4px 0 #3b1f8f;cursor:pointer}
.btn.hot{background:linear-gradient(180deg,#fb7185,#be123c);box-shadow:0 4px 0 #7f1230}
.btn.ghost{background:#2a2460;box-shadow:0 4px 0 #171340}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
#cards{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x proximity}
.card{position:relative;flex:0 0 auto;width:92px;padding:0;border:0;background:none;border-radius:14px;overflow:hidden;cursor:pointer;scroll-snap-align:start}
.card img{display:block;width:100%;height:auto;pointer-events:none}
.card .co{position:absolute;top:5px;left:5px;background:rgba(10,6,30,.85);border:1px solid rgba(251,191,36,.6);border-radius:10px;padding:1px 6px;font-size:12px;color:var(--gold)}
.card canvas{width:56px;height:72px}
.card span{display:block;position:relative}
.nm{font-weight:800;font-size:13px}.sk{font-size:10.5px;color:var(--mut);text-align:center;line-height:1.25;padding:0 3px}.co{font-weight:800;font-size:13px;color:var(--gold)}
.card u{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(5,3,20,.7);pointer-events:none}
.card:active{transform:scale(.96)}
.card.off{opacity:.5}
.hint{margin:0;text-align:center;font-size:12px;color:var(--mut)}
#top{display:flex;gap:8px;align-items:center}#top #sbar{flex:1}
#cn{font-weight:800;font-size:14px;background:var(--panel);border:1px solid rgba(251,191,36,.5);border-radius:15px;padding:4px 10px;color:var(--gold);white-space:nowrap}
.mini{width:36px;height:30px;border-radius:15px;border:1px solid rgba(255,255,255,.2);background:var(--panel);color:#fff;font-size:16px}
#items{display:flex;gap:6px;flex-wrap:wrap}
.it{border:1px solid rgba(251,191,36,.5);background:linear-gradient(180deg,#3a2a6a,#241a4a);color:#fff;border-radius:12px;padding:6px 10px;font-weight:700;font-size:13px;font-family:inherit}
#scr{position:fixed;inset:0;z-index:50;background:rgba(8,6,24,.98);overflow-y:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(28px + env(safe-area-inset-bottom,0px));display:none}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.wrap h1{margin:0;text-align:center;font-size:30px;font-weight:900;letter-spacing:.05em;background:linear-gradient(180deg,#fff,#c4b5fd 60%,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent}
.wrap h2,.wrap h3{margin:4px 0}
.cb{align-self:center;font-weight:800;color:var(--gold);background:var(--panel);border:1px solid rgba(251,191,36,.5);border-radius:16px;padding:5px 14px}
.full{width:100%}.bar{display:flex;justify-content:space-between;align-items:center}
.sm{padding:7px 12px;font-size:13px;border-radius:11px}.btn:disabled{opacity:.45;box-shadow:none;cursor:default}
.st{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid #3a2f70;border-left:6px solid var(--c);background:#17123a;color:var(--ink);border-radius:14px;padding:10px 12px;font-family:inherit;cursor:pointer}
.st b{font-size:22px;color:var(--c);width:30px;text-align:center}.st span{flex:1;display:flex;flex-direction:column}.st i{font-style:normal;font-weight:800}.st small{color:var(--mut);font-size:11.5px}.st.lk{opacity:.45}
.tabs{display:flex;gap:6px}.tb{flex:1;padding:8px 0;border-radius:12px;border:1px solid rgba(167,139,250,.4);background:#17123a;color:var(--mut);font-weight:700;font-size:13px;font-family:inherit}.tb.on{background:#5b34c8;color:#fff}
.row{display:flex;align-items:center;gap:10px;background:#17123a;border:1px solid rgba(167,139,250,.25);border-radius:14px;padding:8px}
.ri{font-size:26px;width:44px;text-align:center}.th{width:44px;height:58px;object-fit:cover;object-position:top;border-radius:8px;display:block}
.rt{flex:1;display:flex;flex-direction:column;gap:2px}.rt small{color:var(--mut);font-size:11.5px;line-height:1.3}
.it{display:flex;align-items:center;gap:6px}.ii{height:30px;width:24px;object-fit:cover;object-position:top;border-radius:6px}
.mm{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:16px 14px;border-radius:18px;border:1px solid rgba(167,139,250,.45);background:linear-gradient(135deg,#2b2266,#17123a);color:var(--ink);font-family:inherit;cursor:pointer}
.mm:active{transform:scale(.98)}.mm .mi{font-size:34px;width:44px;text-align:center}.mm .mt{flex:1;display:flex;flex-direction:column;gap:3px}.mm b{font-size:18px}.mm small{color:var(--mut);font-size:12px;line-height:1.35}.mm em{font-size:26px;color:var(--acc);font-style:normal}
.sub{margin:0;color:var(--mut);font-size:13px;line-height:1.4}
.ag{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ar{border:1px solid rgba(167,139,250,.4);border-radius:14px;overflow:hidden;padding:0;background:#17123a;color:#fff;font-family:inherit;cursor:pointer}.ar:active{transform:scale(.97)}.ar img,.ar .ph{display:block;width:100%;aspect-ratio:800/440;object-fit:cover}.ar span{display:block;padding:6px 8px;font-size:12.5px;font-weight:700;text-align:left}
</style></head><body>
<div id="app">
<div id="top"><div id="sbar"><div id="sfill"></div><div id="stxt"></div></div><div id="cn">🪙 0</div><button id="home" class="mini">⌂</button></div>
<div id="stage"><canvas id="c" width="800" height="440"></canvas><div id="ov"></div></div>
<div id="items"></div>
<div id="cards"></div>
<p class="hint" id="hint">Geser kartu ke samping, ketuk untuk memanggil hantu.</p>
</div>
<div id="scr"></div>
